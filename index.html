<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studently AI Tutor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4a6bff;
            --secondary-color: #f0f4ff;
            --accent-color: #3451d1;
            --text-color: #333;
            --light-text: #666;
            --background-color: #f9faff;
            --card-background: white;
            --input-background: #f5f7ff;
            --border-color: #eee;
            --input-border: #ddd;
            --border-radius: 12px;
            --shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            --header-bg: white;
        }
        
        [data-theme="dark"] {
            --primary-color: #5d7aff;
            --secondary-color: #2a3147;
            --accent-color: #7b92ff;
            --text-color: #e0e0e0;
            --light-text: #a0a0a0;
            --background-color: #121212;
            --card-background: #1e1e1e;
            --input-background: #2a2a2a;
            --border-color: #333;
            --input-border: #444;
            --shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            --header-bg: #1a1a1a;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background-color: var(--header-bg);
            padding: 20px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo i {
            color: var(--primary-color);
            font-size: 28px;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--primary-color);
        }
        
        .theme-toggle {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 20px;
            background-color: var(--input-background);
        }
        
        .theme-toggle:hover {
            background-color: var(--secondary-color);
        }
        
        .theme-toggle span {
            font-size: 14px;
            font-weight: 500;
        }
        
        main {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 70vh;
            background-color: var(--card-background);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .chat-header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #chat_output {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .message {
            margin-bottom: 20px;
            max-width: 80%;
            position: relative;
        }
        
        .user-message {
            align-self: flex-end;
            margin-left: auto;
            background-color: var(--primary-color);
            color: white;
            border-radius: 18px 18px 4px 18px;
            padding: 12px 15px;
        }
        
        .ai-message {
            align-self: flex-start;
            background-color: var(--secondary-color);
            color: var(--text-color);
            border-radius: 18px 18px 18px 4px;
            padding: 12px 15px;
        }
        
        .message-label {
            font-size: 12px;
            color: var(--light-text);
            margin-bottom: 5px;
        }
        
        .input-container {
            display: flex;
            gap: 10px;
            padding: 15px;
            background-color: var(--input-background);
            border-top: 1px solid var(--border-color);
        }
        
        #user_input {
            flex: 1;
            padding: 15px;
            border: 1px solid var(--input-border);
            border-radius: 25px;
            font-size: 16px;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
            background-color: var(--card-background);
            color: var(--text-color);
        }
        
        #user_input:focus {
            border-color: var(--primary-color);
        }
        
        .send-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .send-btn:hover {
            background-color: var(--accent-color);
        }
        
        .typing-indicator {
            display: none;
            padding: 10px;
            color: var(--light-text);
            font-style: italic;
        }
        
        .typing-indicator span {
            animation: dot 1.4s infinite;
            animation-fill-mode: both;
            margin-left: 2px;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes dot {
            0% { opacity: 0.2; }
            20% { opacity: 1; }
            100% { opacity: 0.2; }
        }
        
        @media (max-width: 768px) {
            main {
                padding: 10px;
            }
            
            .chat-container {
                height: 80vh;
            }
            
            .theme-toggle span {
                display: none;
            }

            .formatted-content {
                font-size: 16px;
                line-height: 1.6;
            }

            .formatted-content h1, 
            .formatted-content h2, 
            .formatted-content h3 {
                margin-top: 16px;
                margin-bottom: 8px;
                color: var(--primary-color);
            }

            .formatted-content h1 {
                font-size: 22px;
            }

            .formatted-content h2 {
                font-size: 20px;
            }

            .formatted-content h3 {
                font-size: 18px;
            }

            .formatted-content p {
                margin-bottom: 12px;
            }

            .formatted-content strong {
                color: var(--primary-color);
                font-weight: 600;
            }

            .formatted-content ul, 
            .formatted-content ol {
                margin-left: 20px;
                margin-bottom: 12px;
            }

            .formatted-content li {
                margin-bottom: 4px;
            }

            .study-table {
                width: 100%;
                border-collapse: collapse;
                margin: 15px 0;
            }

            .study-table th {
                background-color: var(--primary-color);
                color: white;
                padding: 8px;
                text-align: left;
            }

            .study-table td {
                padding: 8px;
                border: 1px solid var(--border-color);
            }

            .study-table tr:nth-child(even) {
                background-color: var(--input-background);
            }

            /* Style for key points */
            .formatted-content em {
                font-style: italic;
                color: var(--accent-color);
            }
            .sidebar-container {
                position: relative;
                height: 0;
            }

            .history-toggle {
                position: fixed;
                bottom: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
                background-color: var(--primary-color);
                color: white;
                border: none;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                box-shadow: var(--shadow);
                z-index: 990;
                transition: background-color 0.3s;
            }

            .history-toggle:hover {
                background-color: var(--accent-color);
            }

            .history-sidebar {
                position: fixed;
                top: 0;
                right: -300px;
                width: 300px;
                height: 100vh;
                background-color: var(--card-background);
                box-shadow: var(--shadow);
                z-index: 1000;
                transition: right 0.3s ease;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .history-sidebar.open {
                right: 0;
            }

            .history-header {
                padding: 15px;
                background-color: var(--primary-color);
                color: white;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .history-header h2 {
                font-size: 18px;
                font-weight: 600;
                margin: 0;
            }

            .new-chat-btn {
                background-color: white;
                color: var(--primary-color);
                border: none;
                border-radius: 18px;
                padding: 5px 10px;
                display: flex;
                align-items: center;
                gap: 5px;
                font-size: 14px;
                cursor: pointer;
                transition: background-color 0.3s;
            }

            .new-chat-btn:hover {
                background-color: #f0f0f0;
            }

            .history-list {
                flex: 1;
                overflow-y: auto;
                padding: 10px;
            }

            .history-item {
                padding: 12px;
                border-radius: var(--border-radius);
                margin-bottom: 10px;
                background-color: var(--input-background);
                cursor: pointer;
                position: relative;
                transition: background-color 0.2s;
            }

            .history-item:hover {
                background-color: var(--secondary-color);
            }

            .history-title {
                font-weight: 500;
                margin-bottom: 5px;
                padding-right: 25px;
            }

            .history-date {
                font-size: 12px;
                color: var(--light-text);
            }

            .delete-history {
                position: absolute;
                top: 10px;
                right: 10px;
                background: none;
                border: none;
                color: var(--light-text);
                cursor: pointer;
                padding: 3px;
                opacity: 0.7;
                transition: opacity 0.2s;
            }

            .delete-history:hover {
                opacity: 1;
                color: #ff4444;
            }

            .empty-history {
                text-align: center;
                padding: 20px;
                color: var(--light-text);
                font-style: italic;
            }

            /* Mobile responsiveness */
            @media (max-width: 768px) {
                .history-sidebar {
                    width: 100%;
                    right: -100%;
                }
                
                .history-sidebar.open {
                    right: 0;
                }
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <i class="fas fa-brain"></i>
            <h1>Studently AI Tutor</h1>
        </div>
        <!-- Add this right after your header -->
<div class="sidebar-container">
    <button id="history_toggle" class="history-toggle" onclick="toggleHistorySidebar()">
        <i class="fas fa-history"></i>
    </button>
    
    <div id="history_sidebar" class="history-sidebar">
        <div class="history-header">
            <h2>Chat History</h2>
            <button id="new_chat" class="new-chat-btn">
                <i class="fas fa-plus"></i> New Chat
            </button>
        </div>
            <div id="history_list" class="history-list">
                <!-- History items will be added here by JavaScript -->
            </div>
        </div>
    </div>
        <button id="theme_toggle" class="theme-toggle" onclick="toggleTheme()">
            <i class="fas fa-moon"></i>
            <span>Dark Mode</span>
        </button>
    </header>
    
    <main>
        <div class="chat-container">
            <div class="chat-header">
                <i class="fas fa-robot"></i>
                <span>Chat with your AI Tutor</span>
            </div>
            
            <div id="chat_output">
                <!-- Messages will appear here -->
                <div class="message ai-message">
                    <div class="message-label">AI Tutor</div>
                    Hi there! I'm your AI study assistant. How can I help you with your learning today?
                </div>
            </div>
            
            <div class="typing-indicator" id="typing_indicator">
                AI is typing<span>.</span><span>.</span><span>.</span>
            </div>
            
            <div class="input-container">
                <textarea id="user_input" placeholder="Ask me anything..." rows="1"></textarea>
                <button class="send-btn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
